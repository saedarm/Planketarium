apply plugin: 'com.android.application'

android {
    namespace 'com.saedarm.corecanvas'
    compileSdk 35
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    defaultConfig {
        applicationId 'com.saedarm.corecanvas'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes { release { minifyEnabled false } }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    ['armeabi-v7a', 'arm64-v8a', 'x86_64'].each { abi ->
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$abi"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-$abi"
    }
}

// Unpack the libGDX .so files into libs/<abi>/ before packaging.
tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86_64'].find { jar.name.endsWith("natives-${it}.jar") }
            if (abi != null) {
                def out = file("libs/$abi")
                out.mkdirs()
                copy { from zipTree(jar); into out; include '*.so' }
            }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { it.dependsOn 'copyAndroidNatives' }
